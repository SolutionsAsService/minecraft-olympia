# Build settings for olympia.
#
# Keep mod_version in step with shadw.mod.json "version" and minecraft_version
# with "game_versions": `tools/shadw-mod validate` fails when they drift.
#
# Versions are the current stable releases from the Fabric maven and meta
# services (checked when this template was written). Bump fabric_version
# whenever minecraft_version changes: Fabric API tags are "<api>+<minecraft>".

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=1.21.4
loader_version=0.20.1
fabric_version=0.119.4+1.21.4
loom_version=1.11.8

mod_version=0.1.0
maven_group=dev.shadw.olympia
archives_base_name=olympia
